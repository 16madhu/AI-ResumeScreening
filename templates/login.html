
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ResumeScope</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-brand-panel">
    <div class="auth-brand">
      <div class="auth-brand-icon">🔍</div>
      <div class="auth-brand-content">
        <div class="eyebrow">ResumeScope</div>
        <h1>Welcome back</h1>
        <p>Access your AI‑powered resume analysis dashboard.</p>
      </div>
    </div>
    <div class="auth-brand-footer">© 2024 ResumeScope</div>
  </div>
  <div class="auth-form-panel">
    <div class="auth-card">
      <h2>Sign In</h2>
      <div class="auth-subtitle">Enter your credentials to continue.</div>
      <form id="login-form">
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <button type="submit" class="auth-submit">Sign In</button>
      </form>
      <div class="auth-message" id="msg" role="status" aria-live="polite"></div>
      <div class="auth-switch">Don’t have an account? <a href="{{ url_for('signup_page') }}">Create one</a></div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</body>
</html>
